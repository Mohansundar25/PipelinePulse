<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>PipelinePulse</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #1e293b; }
    h1 { margin: 0; font-size: 22px; }
    main { padding: 24px; display: grid; gap: 20px; }
    .repo { background: #1e293b; border-radius: 12px; padding: 16px; }
    .stats { display: flex; gap: 24px; margin: 8px 0 12px; color: #94a3b8; }
    .stats b { color: #f8fafc; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
    a { color: #93c5fd; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #475569; }
    .success { background: #166534; } .failure { background: #991b1b; } .in_progress, .queued { background: #a16207; }
    .ai-btn { background: #6366f1; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    .ai-box { margin-top: 6px; padding: 8px; background: #312e81; border-radius: 6px; font-size: 13px; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <header><h1>⚡ PipelinePulse</h1><span id='updated'>Loading…</span></header>
  <main id='repos'></main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
    const fmt = (s) => (s == null ? '—' : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`);
    const badge = (r) => { const v = r.status !== 'completed' ? r.status : r.conclusion; return `<span class='badge ${v}'>${v}</span>`; };

    function renderRepo({ repo, stats, runs, error }) {
      if (error) return `<section class='repo'><h2>${esc(repo)}</h2><p class='error'>${esc(error)}</p></section>`;
      const rows = runs.map((r) => `
        <tr>
          <td><a href='${r.url}' target='_blank'>${esc(r.name)}</a><div id='ai-${r.id}'></div></td>
          <td>${esc(r.branch)}</td><td>${badge(r)}</td><td>${fmt(r.durationSec)}</td>
          <td>${new Date(r.createdAt).toLocaleString()}</td>
          <td>${r.conclusion === 'failure' ? `<button class='ai-btn' data-repo='${esc(repo)}' data-run='${r.id}'>🤖 Explain with AI</button>` : ''}</td>
        </tr>`).join('');
      return `<section class='repo'>
        <h2>${esc(repo)}</h2>
        <div class='stats'>
          <span>Success rate <b>${stats.successRate ?? '—'}%</b></span>
          <span>Failures <b>${stats.failures}</b></span>
          <span>Avg build <b>${fmt(stats.avgDurationSec)}</b></span>
        </div>
        <table><tr><th>Workflow</th><th>Branch</th><th>Status</th><th>Duration</th><th>Started</th><th></th></tr>${rows}</table>
      </section>`;
    }

    async function load() {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('updated').textContent = data.updatedAt ? `Updated ${new Date(data.updatedAt).toLocaleTimeString()}` : 'Waiting for first poll…';
      document.getElementById('repos').innerHTML = data.repos.map(renderRepo).join('') || '<p>No repositories configured. Set GITHUB_REPOS in .env</p>';
    }

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('.ai-btn');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'Analyzing…';
      const box = document.getElementById(`ai-${btn.dataset.run}`);
      try {
        const res = await fetch(`/api/repos/${btn.dataset.repo}/runs/${btn.dataset.run}/analysis`);
        const a = await res.json();
        if (!res.ok) throw new Error(a.message);
        box.innerHTML = `<div class='ai-box'><b>🤖 ${esc(a.summary)}</b><br/>Cause: ${esc(a.likelyCause)}<br/>Fix: ${esc(a.suggestedFix)}<br/>Severity: ${esc(a.severity)}</div>`;
        btn.remove();
      } catch (err) {
        box.innerHTML = `<div class='ai-box error'>AI analysis failed: ${esc(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = '🤖 Explain with AI';
      }
    });

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
